<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f1e9">
<title>Constitution Quest — Study Arcade</title>
<style>
:root{
 --bg:#f4f1e9;--surface:#fffdf8;--surface2:#ebe7dc;--ink:#202a25;--muted:#738078;
 --line:#e1ded3;--green:#174c3e;--green2:#276c56;--mint:#dceee4;--lime:#c7ee91;
 --orange:#f18b63;--yellow:#f3c96b;--blue:#a9c7e8;--red:#e87568;
 --shadow:0 12px 32px rgba(37,52,42,.08);--nav:rgba(255,253,248,.94);
 --hero-grad:linear-gradient(140deg,#174c3e,#286b55 65%,#51896c);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5;transition:background .25s,color .25s}
button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
body.dark{
 --bg:#0c1310;--surface:#151f19;--surface2:#202c24;--ink:#edf5ee;--muted:#a0b1a5;
 --line:#2b3b30;--green:#183d31;--green2:#7cc5a0;--mint:#203a2e;--lime:#d2f39e;
 --orange:#f29a78;--yellow:#f3ce7b;--blue:#91b6db;--red:#f08a7d;
 --shadow:0 14px 38px rgba(0,0,0,.28);--nav:rgba(15,23,18,.96);
 --hero-grad:linear-gradient(145deg,#142f26,#1c4938 65%,#285a43);
 color-scheme:dark;
}
.app{max-width:760px;min-height:100dvh;margin:auto;padding-bottom:calc(82px + env(safe-area-inset-bottom))}
.topbar{height:68px;padding:0 17px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brandmark{width:39px;height:39px;border-radius:13px;background:var(--green);color:#fff;display:grid;place-items:center;font-size:21px;font-weight:900}
.brandname{font-size:13px;font-weight:950;letter-spacing:.6px}.brandmeta{font-size:10px;color:var(--muted)}
.iconbtn{width:39px;height:39px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:17px}
main{padding:9px 16px 25px}
.screen{animation:screenIn .28s ease both}
@keyframes screenIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
@keyframes titleIn{from{opacity:0;transform:translateY(12px);letter-spacing:-.9px}to{opacity:1;transform:translateY(0);letter-spacing:-.45px}}
@keyframes cardIn{from{opacity:0;transform:scale(.975) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes heartPop{0%{opacity:0;transform:scale(.3)}35%{opacity:1;transform:scale(1.25)}100%{opacity:0;transform:scale(1)}}
@keyframes progressIn{from{width:0}to{width:var(--progress)}}
h1,h2,h3,p{margin-top:0}
h1{animation:titleIn .45s cubic-bezier(.2,.8,.2,1) both}
.eyebrow{font-size:10px;letter-spacing:1.7px;text-transform:uppercase;font-weight:900;color:var(--green2)}
body.dark .eyebrow{color:var(--lime)}
.hero{background:var(--hero-grad);border-radius:25px;padding:23px 21px;color:#fff;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero:after{content:"";position:absolute;width:210px;height:210px;border:1px solid #ffffff24;border-radius:50%;right:-95px;top:-100px;box-shadow:0 0 0 24px #ffffff09,0 0 0 49px #ffffff07}
.hero .eyebrow{color:#d6f0df}.hero h1{font-size:clamp(29px,8vw,39px);line-height:1.08;letter-spacing:-1.1px;margin:9px 0}
.hero p{color:#e0eee5;font-size:13px;max-width:430px;margin:0}
.herofoot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px;position:relative;z-index:1}
.primary{border:0;background:var(--lime);color:#183324;border-radius:13px;padding:12px 16px;font-size:13px;font-weight:900;box-shadow:0 3px 0 #7f9e59;transition:transform .16s,filter .16s}
.primary:active{transform:translateY(2px);filter:brightness(.95);box-shadow:0 1px 0 #7f9e59}
.secondary{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:13px;padding:11px 14px;font-size:13px;font-weight:800}
.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:23px 2px 11px}
.sectionhead h2{font-size:17px;letter-spacing:-.35px;margin:0}.sectionhead span{font-size:11px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:19px;padding:15px;box-shadow:var(--shadow)}
.progressrow{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--muted)}
.progressrow b{color:var(--ink)}
.progressbar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:10px 0 7px}
.progressbar span{height:100%;display:block;width:var(--progress);background:linear-gradient(90deg,var(--green2),var(--lime));border-radius:99px;transition:width .5s}
.path{display:grid;gap:9px}
.pathitem{width:100%;display:flex;align-items:center;gap:11px;text-align:left;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;color:var(--ink);transition:transform .16s,border-color .16s}
.pathitem:active{transform:scale(.985)}
.pathnum{width:38px;height:38px;flex:none;border-radius:12px;background:var(--mint);color:var(--green2);display:grid;place-items:center;font-weight:950}
.pathcopy{min-width:0;flex:1}.pathcopy b{display:block;font-size:13px;line-height:1.3}.pathcopy small{font-size:10px;color:var(--muted)}
.arrow{font-size:20px;color:var(--green2)}
.bottomnav{position:fixed;z-index:30;bottom:0;left:0;right:0;background:var(--nav);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:7px 8px calc(7px + env(safe-area-inset-bottom))}
.navinner{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px}
.navbtn{border:0;background:transparent;color:var(--muted);border-radius:13px;padding:6px 1px;display:grid;justify-items:center;gap:2px;font-size:9px;font-weight:850;transition:background .2s,color .2s}
.navbtn .ico{font-size:19px;line-height:1.2}.navbtn.active{background:var(--mint);color:var(--green2)}
/* Reels: one focused card, not a tiny list of cards */
.reel-head{display:flex;align-items:center;justify-content:space-between;margin:4px 0 11px}
.reel-head h1{font-size:21px;margin:0;letter-spacing:-.5px}
.reel-count{font-size:11px;color:var(--muted);font-weight:800}
.reel-stage{height:min(67dvh,690px);min-height:470px;position:relative;overflow-x:hidden;overflow-y:auto;border-radius:25px;background:#172c22;box-shadow:var(--shadow);touch-action:pan-y;overscroll-behavior:contain;user-select:text;-webkit-overflow-scrolling:touch}
.reel-card{min-height:100%;height:auto;width:100%;position:relative;padding:22px 20px 18px;color:white;display:flex;flex-direction:column;justify-content:space-between;gap:20px;overflow:visible;isolation:isolate;animation:cardIn .26s ease both}
.reel-card:before{content:"";position:absolute;z-index:-1;inset:0;background:var(--reelbg,linear-gradient(145deg,#174c3e,#34775b))}
.reel-card:after{content:"";position:absolute;z-index:-1;width:270px;height:270px;border:1px solid #ffffff27;border-radius:50%;right:-120px;top:-120px;box-shadow:0 0 0 28px #ffffff0b,0 0 0 58px #ffffff08}
.reel-card.theme-1:before{background:linear-gradient(145deg,#9a503d,#d98560)}
.reel-card.theme-2:before{background:linear-gradient(145deg,#354c78,#647fa8)}
.reel-card.theme-3:before{background:linear-gradient(145deg,#594477,#9470a7)}
.reel-card.theme-4:before{background:linear-gradient(145deg,#355e65,#559b91)}
.reel-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.reel-tag{font-size:9px;letter-spacing:1.3px;font-weight:950;color:#ffffffcf}
.reel-progress{height:4px;background:#ffffff35;border-radius:99px;margin-top:13px;overflow:hidden}
.reel-progress span{height:100%;display:block;background:#fff;width:var(--p)}
.reel-center{padding:15px 0;max-height:none;overflow:visible;scrollbar-width:none}
.reel-center::-webkit-scrollbar{display:none}
.reel-kicker{font-size:10px;letter-spacing:1.7px;text-transform:uppercase;color:#ffffffbb;font-weight:900}
.reel-question{font-size:clamp(26px,7vw,36px);line-height:1.12;letter-spacing:-.9px;margin:12px 0 13px;animation:titleIn .35s ease both}
.reel-prompt{font-size:13px;color:#ffffffd6;margin:0}
.reveal-answer{margin-top:17px;border:1px solid #ffffff62;background:#ffffff18;color:#fff;border-radius:15px;padding:13px 14px;text-align:left;width:100%;font-weight:850;font-size:13px;backdrop-filter:blur(8px)}
.answer-content{display:none;margin-top:12px;animation:screenIn .25s ease both}
.answer-content.show{display:block}
.answer-content .answer-label{font-size:9px;letter-spacing:1.5px;font-weight:950;color:#fff4c9;text-transform:uppercase}
.answer-content p{font-size:14px;line-height:1.55;color:#fff;margin:6px 0 13px}
.example-box{border-left:3px solid #fff1a9;padding:8px 0 8px 12px;color:#fff;font-size:12px}
.reel-bottom{display:flex;align-items:center;justify-content:space-between;gap:9px}
.reel-cue{font-size:10px;color:#ffffffcf;max-width:65%}
.reel-actions{display:flex;gap:7px}
.reel-action{border:1px solid #ffffff70;background:#ffffff1d;color:#fff;border-radius:99px;padding:9px 11px;font-size:11px;font-weight:900;backdrop-filter:blur(8px)}
.reel-action.saved{background:#fff;color:#174c3e}
.reel-heart{position:absolute;z-index:8;inset:0;display:grid;place-items:center;font-size:88px;opacity:0;pointer-events:none;text-shadow:0 5px 25px #0005}
.reel-heart.pop{animation:heartPop .7s ease}
.reel-controls{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.reel-controls button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:9px 13px;font-size:12px;font-weight:850}
.reel-instruction{text-align:center;font-size:10px;color:var(--muted);margin:9px 0 0}
.saved-empty{text-align:center;padding:35px 15px;color:var(--muted);background:var(--surface);border-radius:18px;border:1px dashed var(--line)}
/* Lesson flow */
.backrow{display:flex;align-items:center;justify-content:space-between;margin:2px 0 12px}
.textbtn{border:0;background:transparent;color:var(--green2);font-size:12px;font-weight:900;padding:8px 0}
.lessonhero{background:var(--hero-grad);color:#fff;border-radius:21px;padding:18px;margin-bottom:11px}
.lessonhero .eyebrow{color:#d8f0df}.lessonhero h1{font-size:24px;line-height:1.15;margin:7px 0}.lessonhero p{font-size:12px;color:#dfede3;margin:0}
.dots{display:flex;gap:4px;margin:12px 0}.dots i{height:5px;flex:1;border-radius:9px;background:var(--surface2)}.dots i.on{background:var(--orange)}
.lessonpanel{background:var(--surface);border:1px solid var(--line);border-radius:19px;padding:17px;box-shadow:var(--shadow)}
.lessonpanel h2{font-size:21px;line-height:1.2;margin:7px 0 11px}.lessonpanel p{font-size:13px;color:var(--muted);margin:0 0 10px}
.simplebox{background:var(--surface2);border-radius:14px;padding:12px;margin-top:12px;font-size:12px;color:var(--ink)}
.keybox{background:var(--mint);color:var(--green2);border-radius:13px;padding:11px;margin-top:10px;font-size:12px;font-weight:850}
.actionrow{display:flex;gap:8px;margin-top:12px}.actionrow>*{flex:1}
.howto{margin-top:12px;background:var(--surface2);border-radius:15px;padding:13px;font-size:11px;color:var(--muted)}
/* Exam and revision */
.tabs{display:flex;gap:6px;overflow:auto;padding:2px 0 9px;scrollbar-width:none}
.tabs button{white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--green2);border-radius:99px;padding:8px 11px;font-size:11px;font-weight:900}
.tabs button.active{background:var(--green);color:#fff}
.qa{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:13px;margin:8px 0}
.qa h3{font-size:13px;margin:0 0 4px}.qa small{font-size:10px;color:var(--muted)}
.qa button{border:0;background:transparent;color:var(--green2);font-size:11px;font-weight:900;padding:9px 0 0}
.qa-answer{display:none;border-top:1px solid var(--line);margin-top:9px;padding-top:9px;color:var(--muted);font-size:12px}
.qa.open .qa-answer{display:block}
.articlegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.article{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:11px}
.article b{font-size:12px;color:var(--green2);display:block}.article span{font-size:10px;color:var(--muted)}
@media(min-width:620px){main{padding:14px 24px 28px}.hero{padding:29px}.path{grid-template-columns:1fr 1fr}.reel-stage{height:650px;max-width:520px;margin:auto}.reel-head{max-width:520px;margin:5px auto 12px}.reel-controls,.reel-instruction{max-width:520px;margin-left:auto;margin-right:auto}}
@media(max-width:380px){.topbar{height:60px}.reel-stage{height:63dvh;min-height:430px}.reel-card{padding:17px 16px}.reel-question{font-size:25px}.navbtn{font-size:8px}.navbtn .ico{font-size:17px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>

<header class="topbar">
 <div class="brand"><div class="brandmark">§</div><div><div class="brandname">CONSTITUTION QUEST</div><div class="brandmeta">SEMESTER II · STUDY ARCADE</div></div></div>
 <button class="iconbtn" id="themeBtn" aria-label="Toggle theme">☾</button>
</header>
<main id="main"></main>
</div>

<script>
const topics = [
{title:"Chief Minister: appointment, qualifications & powers",icon:"🏛️",intro:"The Chief Minister is the real executive head of the state government. The CM leads the Council of Ministers and is responsible for state administration.",hook:"Think: CM = Captain of the state team. The Governor appoints the captain; the captain coordinates the ministers and departments.",sections:[
["Appointment","The Governor appoints the Chief Minister under Article 164. Normally, the leader of the majority party in the Legislative Assembly is appointed. In a hung assembly, the Governor appoints the person most likely to demonstrate majority support. The CM must retain the confidence of the Legislative Assembly."],
["Qualifications","The person must be an Indian citizen and qualified for membership of the State Legislature. Minimum age is 25 for the Legislative Assembly or 30 for the Legislative Council. If not a member when appointed, the person must become a member within six consecutive months."],
["Executive powers","Supervises state administration and government departments."],
["Selection of Ministers","Recommends ministers to the Governor and allocates portfolios."],
["Legislative powers","Leads government business in the Legislature and coordinates legislative programmes."],
["Financial powers","Guides state financial policies and budget priorities through the Council of Ministers."],
["Advisory role & coordination","Advises the Governor on important matters, coordinates departments and represents the state in dealings with the Union Government."]],
summary:"The Chief Minister is the central figure in state administration and plays a vital role in policy implementation, governance and democratic accountability.",
quiz:[["Under which Article does the Governor appoint the Chief Minister?",["Article 155","Article 164","Article 214","Article 324"],1,"164 → appointment of the Chief Minister."],["A person appointed CM but not yet a legislator must become a member within:",["Three months","Six consecutive months","One year","Two years"],1,"The document specifies six consecutive months."]]},
{title:"Relationship between Governor & Chief Minister",icon:"🤝",intro:"The Governor is the constitutional head of the state, while the Chief Minister is the head of the elected government. Their relationship is mainly governed by Articles 163 and 164.",hook:"Remember the pair: Governor = constitutional head; CM = elected-government head. The key is cooperation, advice and information.",sections:[
["Appointment","The Governor appoints the Chief Minister, normally choosing the leader who commands majority support in the Legislative Assembly."],
["Appointment of ministers","The Governor appoints other ministers on the advice of the Chief Minister."],
["Aid and advice — Article 163","The Council of Ministers headed by the CM aids and advises the Governor, except where the Constitution permits discretion."],
["Information sharing — Article 167","The CM communicates Council of Ministers decisions and legislative proposals to the Governor and provides information when constitutionally required."],
["Legislative functions","The Governor summons and prorogues the State Legislature and may dissolve the Legislative Assembly as constitutionally permitted. These functions are generally exercised on ministerial advice."],
["Bills and assent","The Governor may give assent, withhold assent, return a non-Money Bill for reconsideration, or reserve a bill for the President, subject to constitutional provisions."],
["Constitutional responsibility","The Governor must act within constitutional limits, while the CM is politically accountable to the Legislative Assembly."]],
summary:"A healthy relationship requires constitutional cooperation, respect for democratic mandates and adherence to federal principles.",
quiz:[["Which Article requires the CM to communicate certain decisions and information to the Governor?",["Article 155","Article 163","Article 167","Article 226"],2,"Article 167 is the information link between CM and Governor."],["Who appoints other ministers on the CM's advice?",["President","Governor","Speaker","Chief Justice"],1,"The Governor appoints ministers on the CM's advice."]]},
{title:"Executive, legislative, financial & judicial powers of Governor",icon:"⚖️",intro:"The Governor is the constitutional head of a state under Article 153. The Governor's powers operate within the Constitution and ordinarily on the aid and advice of the Council of Ministers.",hook:"Four power buckets: E-L-F-J → Executive appoints, Legislative makes the House work, Financial handles budget steps, Judicial gives limited clemency.",sections:[
["Executive powers","Appoints the Chief Minister; appoints other ministers on the CM's advice; appoints the Advocate General under Article 165; appoints the State Election Commissioner under Article 243K, subject to constitutional provisions; performs constitutional functions relating to state administration."],
["Legislative powers","Summons and prorogues the State Legislature; may dissolve the Legislative Assembly as constitutionally permitted; addresses the Legislature and sends messages; acts on bills; promulgates ordinances under Article 213 when the Legislature is not in session and conditions are satisfied."],
["Financial powers","Ensures the annual financial statement/state budget is laid before the Legislature. A Money Bill can be introduced in the Legislative Assembly only on the Governor's recommendation. Recommendations are required for certain financial proposals."],
["Judicial powers","Under Article 161, may grant pardons, reprieves, respites or remissions, or suspend, remit or commute sentences within the scope of state executive power. The document notes limits regarding pardons in death-sentence cases. The Governor appoints district judges in consultation with the High Court under Article 233."]],
summary:"The Governor performs executive, legislative, financial and limited clemency functions, always within constitutional principles and judicial interpretation.",
quiz:[["Which Article deals with the Governor's ordinance power?",["Article 161","Article 213","Article 233","Article 324"],1,"Article 213 = Governor's ordinance power."],["The Governor's clemency power is mentioned under:",["Article 143","Article 161","Article 165","Article 226"],1,"Article 161 is the key memory link for clemency."]]},
{title:"Judiciary's contribution to strengthening democracy",icon:"⚖️",intro:"The judiciary protects the Constitution, safeguards Fundamental Rights and ensures public authorities act within the law.",hook:"Picture the judiciary as democracy's safety system: RIGHTS, REVIEW, RULE OF LAW, ELECTIONS, PIL and ACCOUNTABILITY.",sections:[
["Protection of Fundamental Rights","The Supreme Court and High Courts protect rights under Articles 32 and 226. They can issue writs to remedy violations of rights and legal duties."],
["Judicial Review","Courts review laws and executive actions and invalidate those that violate the Constitution."],
["Independence of Judiciary","Constitutional safeguards help judges decide cases without improper interference from the executive or legislature."],
["Rule of Law","Everyone, including public officials and government institutions, is subject to the law."],
["Free and Fair Elections","Courts adjudicate election disputes and review unlawful government actions affecting elections and the constitutionality of election-related laws."],
["Public Interest Litigation (PIL)","PIL enables courts to consider issues affecting disadvantaged groups, environmental protection, human rights and public accountability."],
["Basic Structure Doctrine","In Kesavananda Bharati v. State of Kerala (1973), the Supreme Court developed the Basic Structure Doctrine, limiting Parliament's power to amend the Constitution in a way that destroys its basic structure."],
["Accountability and transparency","Judicial scrutiny helps prevent arbitrary administrative action and reinforces constitutional governance."],
["Challenges","Delays, large backlogs, high litigation costs, shortages of judges and infrastructure, and concerns about access to justice and accountability."]],
summary:"The judiciary strengthens democracy by protecting rights, maintaining constitutional supremacy and holding public authorities accountable. Timely and accessible justice is essential.",
quiz:[["Which case is associated with the Basic Structure Doctrine in the document?",["Maneka Gandhi","Kesavananda Bharati","Golaknath only","Minerva Mills only"],1,"Kesavananda Bharati v. State of Kerala (1973)."],["PIL can bring attention to:",["Only tax disputes","Disadvantaged groups and public issues","Only election schedules","Only ministerial appointments"],1,"PIL supports issues such as disadvantaged groups, environment and human rights."]]},
{title:"Supreme Court: structure, composition & powers",icon:"🏛️",intro:"The Supreme Court of India is the highest judicial authority. It was established on 28 January 1950 and functions under Part V, Chapter IV of the Constitution.",hook:"Use the jurisdiction code O-W-A-A + J-C-R-C: Original, Writ, Appellate, Advisory; Judicial Review, Court of Record, Review, Complete Justice.",sections:[
["Structure and composition","Consists of the Chief Justice of India and other judges as provided by law. The document lists sanctioned strength as 34 judges including the CJI. Judges are formally appointed by the President under Article 124 through the established collegium system."],
["Tenure and removal","A Supreme Court judge retires at 65. Removal is only through the constitutionally prescribed parliamentary process on grounds of proved misbehaviour or incapacity."],
["Original jurisdiction — Article 131","Hears certain disputes between the Union and states or between states, subject to constitutional conditions."],
["Writ jurisdiction — Article 32","Issues writs for enforcement of Fundamental Rights."],
["Appellate jurisdiction — Articles 132–136","Hears appeals in constitutional, civil and criminal matters, including special leave under Article 136."],
["Advisory jurisdiction — Article 143","The President may refer certain questions of law or fact of public importance for an advisory opinion."],
["Judicial Review","Examines the constitutionality of laws and government actions."],
["Court of Record — Article 129","A Court of Record with power to punish for contempt of itself."],
["Review power — Article 137","May review its own judgments, subject to applicable legal rules."],
["Complete Justice — Article 142","May pass decrees or orders necessary for doing complete justice in matters before it."]],
summary:"The Supreme Court protects the Constitution, safeguards Fundamental Rights, resolves important disputes and ensures rule of law throughout India.",
quiz:[["Which Article is associated with the Supreme Court's writ jurisdiction?",["Article 32","Article 131","Article 143","Article 226"],0,"Article 32 = Supreme Court writ jurisdiction."],["At what age does a Supreme Court judge retire, according to the document?",["60","62","65","68"],2,"Supreme Court = 65; High Court = 62."]]},
{title:"Role of High Courts in administration of justice",icon:"🏢",intro:"High Courts are the highest courts at the state level. Article 214 provides for a High Court for each state, though a common High Court may serve two or more states or territories.",hook:"High Court = state-level justice hub. Remember Articles: 214 court, 226 writs, 227 supervision, 235 subordinate judiciary, 215 Court of Record.",sections:[
["Original jurisdiction","Hear certain cases directly, depending on constitutional provisions and applicable laws."],
["Appellate jurisdiction","Hear appeals against judgments of subordinate courts in civil and criminal cases as permitted by law."],
["Writ jurisdiction — Article 226","Issue writs for Fundamental Rights and other legal purposes. The document notes this is broader than Article 32, which concerns Fundamental Rights."],
["Supervisory jurisdiction — Article 227","Supervise subordinate courts and tribunals within territorial jurisdiction, subject to constitutional exceptions."],
["Judicial Review","Examine constitutionality of state laws and executive actions."],
["Protection of Fundamental Rights","Protect citizens against unlawful administrative actions and violations of constitutional rights."],
["Control over subordinate judiciary — Article 235","Exercise control over district and subordinate courts, including important aspects of judicial administration."],
["Court of Record — Article 215","Every High Court is a Court of Record and can punish for contempt of itself."],
